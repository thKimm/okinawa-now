name: Refresh fallback data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run sync:data
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/fallback.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fallback.json
          git commit -m "chore: refresh Google Sheets fallback data"
          git push
